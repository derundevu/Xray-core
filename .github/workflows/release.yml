name: Build and Release

on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing four-part tag; select the same tag as the workflow ref
        required: true
        type: string

# Serialize publication, including numeric latest selection, across all release tags.
concurrency:
  group: proxide-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      upstream-tag: ${{ steps.identity.outputs.upstream-tag }}
      upstream-commit: ${{ steps.identity.outputs.upstream-commit }}
      go-version: ${{ steps.identity.outputs.go-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Validate tag, source version, and ancestry
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag=$REQUESTED_TAG
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == "$tag" ]]
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.[1-9][0-9]*$ ]]
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ && "$commit" == "$GITHUB_SHA" ]]
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main" "refs/heads/fork/main:refs/remotes/origin/fork/main" "refs/tags/$tag:refs/release-validation/tag"
          [[ "$(git rev-parse 'refs/release-validation/tag^{commit}')" == "$commit" ]]
          git merge-base --is-ancestor "$commit" refs/remotes/origin/fork/main
          version=$(go run .github/build/source-version.go)
          [[ "$tag" == "v$version" ]]
          upstream="v${version%.*}"
          git fetch --no-tags https://github.com/XTLS/Xray-core.git "refs/tags/$upstream:refs/release-validation/upstream"
          git merge-base --is-ancestor 'refs/release-validation/upstream^{commit}' "$commit"
          git merge-base --is-ancestor 'refs/release-validation/upstream^{commit}' refs/remotes/origin/main
          upstream_commit=$(git rev-parse 'refs/release-validation/upstream^{commit}')
          toolchain=$(go env GOVERSION)
          [[ "$toolchain" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\ncommit=%s\nversion=%s\nupstream-tag=%s\nupstream-commit=%s\ngo-version=%s\n' "$tag" "$commit" "$version" "$upstream" "$upstream_commit" "${toolchain#go}" >> "$GITHUB_OUTPUT"
      - name: Reject already published releases
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        with:
          script: |
            await require('./.github/build/release.cjs').preflight({ github, context });

  resources:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Download one verified resource snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/build/download-resources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-resources
          path: |
            resources/geoip.dat
            resources/geosite.dat
            resources/wintun/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: release-docker-resources
          path: resources/docker/
          if-no-files-found: error
          overwrite: true

  checks:
    needs: [validate, resources]
    uses: ./.github/workflows/test.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      go-version: ${{ needs.validate.outputs.go-version }}
      resources-artifact: release-resources

  build:
    needs: [validate, resources]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, freebsd, openbsd, linux, darwin]
        goarch: [amd64, '386']
        patch-assetname: ['']
        exclude:
          - goarch: '386'
            goos: darwin
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          - goos: android
            goarch: arm64
          - goos: android
            goarch: amd64
            patch-assetname: android-amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: s390x
          - goos: openbsd
            goarch: arm64
          - goos: openbsd
            goarch: arm
            goarm: 7
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.validate.outputs.go-version }}
      - name: Set up NDK
        if: matrix.goos == 'android'
        run: |
          set -euo pipefail
          curl --fail --show-error --location https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -o android-ndk.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          declare -A arches=([amd64]=x86_64-linux-android24-clang [arm64]=aarch64-linux-android24-clang)
          echo "CC=$GITHUB_WORKSPACE/android-ndk-r28b/toolchains/llvm/prebuilt/linux-x86_64/bin/${arches[$GOARCH]}" >> "$GITHUB_ENV"
          echo CGO_ENABLED=1 >> "$GITHUB_ENV"
      - name: Resolve existing platform filename
        env:
          PATCH_ASSET_NAME: ${{ matrix.patch-assetname }}
        run: |
          set -euo pipefail
          name=$PATCH_ASSET_NAME
          if [[ -z "$name" ]]; then
            name=$(jq -er --arg key "$GOOS-$GOARCH$GOARM" '.[$key].friendlyName' .github/build/friendly-filenames.json)
          fi
          echo "ASSET_NAME=$name" >> "$GITHUB_ENV"
      - name: Build Xray
        run: |
          set -euo pipefail
          mkdir -p build_assets
          commit=$(git rev-parse --short=7 HEAD)
          flags="-X github.com/xtls/xray-core/core.build=$commit -s -w -buildid="
          output=build_assets/xray
          [[ "$GOOS" != windows ]] || output+=.exe
          [[ "$GOOS" != android ]] || flags+=' -checklinkname=0'
          gcflags=all=-l=4
          if [[ "$GOARCH" == mips || "$GOARCH" == mipsle ]]; then
            gcflags=-l=4
          fi
          go build -o "$output" -trimpath -buildvcs=false -gcflags="$gcflags" -ldflags="$flags" -v ./main
          if [[ "$GOARCH" == mips || "$GOARCH" == mipsle ]]; then
            GOMIPS=softfloat go build -o build_assets/xray_softfloat -trimpath -buildvcs=false -gcflags="$gcflags" -ldflags="$flags" -v ./main
          fi
      - uses: actions/download-artifact@v8
        with:
          name: release-resources
          path: resources
      - name: Package archive and digests
        run: bash .github/build/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-archive-${{ env.ASSET_NAME }}
          path: Xray-${{ env.ASSET_NAME }}.zip*
          if-no-files-found: error
          overwrite: true

  win7:
    needs: [validate, resources]
    uses: ./.github/workflows/release-win7.yml
    with:
      commit: ${{ needs.validate.outputs.commit }}
      go-version: ${{ needs.validate.outputs.go-version }}
      resources-artifact: release-resources

  docker:
    needs: [validate, resources, checks, build, win7]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      commit: ${{ needs.validate.outputs.commit }}
      go-version: ${{ needs.validate.outputs.go-version }}

  publish:
    needs: [validate, checks, build, win7, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-archive-*
          path: release-assets
          merge-multiple: true
      - name: Generate complete ZIP checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Xray-*.zip > SHA256SUMS
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload draft assets, promote Docker digest, and publish
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          UPSTREAM_TAG: ${{ needs.validate.outputs.upstream-tag }}
          UPSTREAM_COMMIT: ${{ needs.validate.outputs.upstream-commit }}
          RELEASE_IMAGE: ${{ needs.docker.outputs.image }}
          RELEASE_DIGEST: ${{ needs.docker.outputs.digest }}
        with:
          script: |
            await require('./.github/build/release.cjs').publish({ github, context });
