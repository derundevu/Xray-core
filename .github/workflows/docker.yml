name: Build Docker Release Digests

on:
  workflow_call:
    inputs:
      tag:
        description: Existing four-part release tag
        required: true
        type: string
      commit:
        description: Full release commit SHA
        required: true
        type: string
      go-version:
        description: Exact Go toolchain version
        required: true
        type: string
    outputs:
      image:
        description: Lowercase GHCR image name
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Combined immutable multiarchitecture manifest digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.validate.outputs.image }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Validate release inputs
        id: validate
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ inputs.commit }}
          GO_VERSION: ${{ inputs.go-version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.[1-9][0-9]*$ ]] || { echo "Invalid four-part release tag" >&2; exit 1; }
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full release commit SHA" >&2; exit 1; }
          [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an exact Go toolchain version" >&2; exit 1; }
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tag resolves to source commit
        env:
          SOURCE_TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$BUILD_COMMIT" ]]
          [[ "$(git rev-parse "refs/tags/${SOURCE_TAG}^{commit}")" == "$BUILD_COMMIT" ]]

      - name: Download release resource snapshot
        uses: actions/download-artifact@v8
        with:
          name: release-docker-resources
          path: resources/docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (main architectures)
        id: main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64/v8
            linux/ppc64le
            linux/s390x
          build-args: |
            GO_VERSION=${{ inputs.go-version }}
            BUILD_COMMIT=${{ inputs.commit }}
            VERSION=${{ inputs.tag }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          outputs: type=image,name=${{ steps.validate.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Build Docker image (additional architectures)
        id: additional
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.usa
          platforms: |
            linux/386
            linux/arm/v6
            linux/riscv64
            linux/loong64
          build-args: |
            GO_VERSION=${{ inputs.go-version }}
            BUILD_COMMIT=${{ inputs.commit }}
            VERSION=${{ inputs.tag }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          outputs: type=image,name=${{ steps.validate.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Push combined manifest by digest only
        id: manifest
        env:
          IMAGE: ${{ steps.validate.outputs.image }}
          MAIN_DIGEST: ${{ steps.main.outputs.digest }}
          ADDITIONAL_DIGEST: ${{ steps.additional.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --dry-run \
            "$IMAGE@$MAIN_DIGEST" \
            "$IMAGE@$ADDITIONAL_DIGEST" > combined-manifest.json
          digest="sha256:$(sha256sum combined-manifest.json | cut -d ' ' -f 1)"
          media_type="$(jq -er '.mediaType' combined-manifest.json)"
          repository="${IMAGE#ghcr.io/}"
          token="$(curl --silent --show-error --fail-with-body \
            --user "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            --get --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull,push" \
            https://ghcr.io/token | jq -er '.token // .access_token')"
          echo "::add-mask::$token"
          # Registry V2 accepts a digest as the manifest reference: no public tag is touched.
          curl --silent --show-error --fail-with-body \
            --request PUT \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: $media_type" \
            --data-binary @combined-manifest.json \
            --output /dev/null \
            "https://ghcr.io/v2/${repository}/manifests/${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
