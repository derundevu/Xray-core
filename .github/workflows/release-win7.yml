name: Build Windows 7 packages

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      go-version:
        type: string
        required: true
      resources-artifact:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            assetname: win7-64
          - goarch: '386'
            assetname: win7-32
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      ASSET_NAME: ${{ matrix.assetname }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
      - name: Install version-matched patched Windows 7 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_GO: ${{ inputs.go-version }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/XTLS/go-win7/releases/tags/patched-${EXPECTED_GO}")
          asset=$(jq -cer '[.assets[] | select(.name == "go-for-win7-linux-amd64.zip")] | if length == 1 then .[0] else error("missing patched Go asset") end' <<< "$release")
          url=$(jq -r .browser_download_url <<< "$asset")
          curl --fail --show-error --location "$url" -o "$RUNNER_TEMP/go-win7.zip"
          digest=$(jq -r '.digest // empty' <<< "$asset")
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/go-win7.zip" | sha256sum --check --strict
          fi
          goroot="$RUNNER_TEMP/go-win7"
          mkdir -p "$goroot"
          unzip -q "$RUNNER_TEMP/go-win7.zip" -d "$goroot"
          actual=$(GOROOT="$goroot" "$goroot/bin/go" env GOVERSION)
          [[ "$actual" == "go$EXPECTED_GO" ]] || { echo "Patched Windows 7 toolchain $actual does not match go$EXPECTED_GO" >&2; exit 1; }
          echo "GOROOT=$goroot" >> "$GITHUB_ENV"
          echo "$goroot/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.resources-artifact }}
          path: resources
      - name: Build Xray
        run: |
          set -euo pipefail
          mkdir -p build_assets
          commit=$(git rev-parse --short=7 HEAD)
          go build -o build_assets/xray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=$commit -s -w -buildid=" -v ./main
      - name: Package archive and digests
        run: bash .github/build/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-archive-${{ matrix.assetname }}
          path: Xray-${{ matrix.assetname }}.zip*
          if-no-files-found: error
          overwrite: true
