name: Tests and Checkings

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      go-version:
        type: string
        default: ''
      resources-artifact:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resources:
    if: inputs.resources-artifact == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Download verified geodata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/build/download-resources.sh --geodata-only
      - uses: actions/upload-artifact@v7
        with:
          name: checks-resources
          path: resources/
          if-no-files-found: error
          overwrite: true

  check-format-and-proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          check-latest: ${{ inputs.go-version == '' }}
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check Protobuf
        run: go run ./infra/vprotogen/main.go -mode check -pwd ./
      - name: Check release note boundaries
        run: node --test .github/build/release-notes.test.cjs

  test:
    needs: resources
    if: ${{ !cancelled() && (needs.resources.result == 'success' || needs.resources.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    env:
      XRAY_LOCATION_ASSET: ${{ github.workspace }}/resources
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          check-latest: ${{ inputs.go-version == '' }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.resources-artifact || 'checks-resources' }}
          path: resources
      - name: Test
        run: go test -timeout 1h -v ./...
      - name: Native CLI version and configuration smoke
        run: |
          set -euo pipefail
          version=$(go run .github/build/source-version.go)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.[1-9][0-9]*$ ]]
          commit=$(git rev-parse --short=7 HEAD)
          go build -trimpath -buildvcs=false -ldflags="-X github.com/xtls/xray-core/core.build=$commit" -o smoke-xray.exe ./main
          statement=$(./smoke-xray.exe version)
          printf '%s\n' "$statement"
          read -r product actual _ <<< "$statement"
          [[ "$product" == Xray && "$actual" == "$version" ]]
          cat > smoke-config.json <<'JSON'
          {"log":{"loglevel":"warning"},"outbounds":[{"tag":"direct","protocol":"freedom"}],"routing":{"rules":[{"type":"field","domain":["geosite:cn"],"outboundTag":"direct"},{"type":"field","ip":["geoip:private"],"outboundTag":"direct"}]}}
          JSON
          ./smoke-xray.exe run -test -config smoke-config.json
          printf '%s\n' '{"outbounds":[{"protocol":"not-a-protocol"}]}' > smoke-invalid.json
          if ./smoke-xray.exe run -test -config smoke-invalid.json; then
            echo 'Invalid configuration unexpectedly accepted' >&2
            exit 1
          fi
